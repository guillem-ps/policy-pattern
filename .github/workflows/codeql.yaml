name: Code Quality Pipeline

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 0 * * 1" # Every Monday at 00:00 UTC

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: CodeQL analysis (python)
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'retrigger-ci'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: python
          queries: security-extended, security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:python"
          upload: never
