name: Release Pipeline

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/policy-pattern
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Detect manual release-bump label
        id: bump-label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          labels_raw=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[].labels[].name')
          mapfile -t labels <<< "$labels_raw"
          bump=$(bash .github/scripts/resolve_release_bump.sh "${labels[@]}")
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.RELEASE_TOKEN }}
          force: ${{ steps.bump-label.outputs.bump }}

      - name: Restore Git ownership
        # python-semantic-release's step runs in its own Docker container
        # as root and commits/tags there, leaving files under .git owned
        # by root in the shared workspace. Later steps run as the normal
        # runner user and can't write to them (e.g. .git/COMMIT_EDITMSG)
        # without this.
        if: steps.release.outputs.released == 'true'
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/.git"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.release.outputs.released == 'true'

      - name: Sync uv.lock and CITATION.cff with the released version
        if: steps.release.outputs.released == 'true'
        run: |
          uv lock
          # version_variables only stamps CITATION.cff's `version:` field —
          # date-released isn't a version string, so it never gets touched
          # by semantic-release itself. Stamp it here instead.
          sed -i "s/^date-released: .*/date-released: \"$(date -u +%F)\"/" CITATION.cff
          if ! git diff --quiet -- uv.lock CITATION.cff; then
            git add uv.lock CITATION.cff
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: sync uv.lock and CITATION.cff date with released version"
            git push
          fi

      - name: Build distributions
        if: steps.release.outputs.released == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
