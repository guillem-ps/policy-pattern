name: Release Pipeline

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/policy-pattern
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@21ed7fa03e4a17ac49406eff4b60d5ad050fbdc2 # v9
        with:
          github_token: ${{ secrets.RELEASE_TOKEN }}

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        if: steps.release.outputs.released == 'true'

      - name: Sync uv.lock with the released version
        if: steps.release.outputs.released == 'true'
        run: |
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git add uv.lock
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: sync uv.lock with released version"
            git push
          fi

      - name: Build distributions
        if: steps.release.outputs.released == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
