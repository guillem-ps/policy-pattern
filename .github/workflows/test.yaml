name: Test Pipeline

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'retrigger-ci'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Run tests (excluding integration)
        run: uv run --python ${{ matrix.python-version }} pytest -m "not integration"

  test-integration:
    name: Test (integration, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'retrigger-ci'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Run integration tests
        run: uv run --python ${{ matrix.python-version }} pytest -m integration

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'retrigger-ci'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install dependencies
        run: uv sync --locked --only-group test
      - name: Run tests with coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage combine
          uv run coverage xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
