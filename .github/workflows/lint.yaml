name: Lint Pipeline

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --locked
      - name: ruff format --check
        run: uv run ruff format --check
      - name: ruff check
        run: uv run ruff check
      - name: ty check
        run: uv run ty check
