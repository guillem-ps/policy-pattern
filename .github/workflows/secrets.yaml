name: Secret Scanning Pipeline

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: docker://zricethezav/gitleaks:v8.27.0
        with:
          args: detect --source=/github/workspace --redact --verbose
