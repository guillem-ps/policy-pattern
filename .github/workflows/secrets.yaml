name: Secret Scanning Pipeline

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: docker://zricethezav/gitleaks@sha256:090a2715530bd6592342e6a66c3f35eafcaaf2a3227a312482504f9c854997e3 # v8.27.0
        with:
          args: detect --source=/github/workspace --redact --verbose
